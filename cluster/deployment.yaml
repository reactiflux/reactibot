apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactibot-deployment
spec:
  selector:
    matchLabels:
      app: reactibot
  replicas: 1
  template:
    metadata:
      labels:
        app: reactibot
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: reactibot
          image: $(IMAGE)
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: HOME # npm (CMD) writes ~/.npm logs; /home/node is read-only
              value: /tmp
            - name: ENVIRONMENT
              value: production
            - name: DISCORD_HASH
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: DISCORD_HASH
            - name: GH_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: GH_READ_TOKEN
            - name: AMPLITUDE_KEY
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: AMPLITUDE_KEY
            - name: DISCORD_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: DISCORD_PUBLIC_KEY
            - name: DISCORD_APP_ID
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: DISCORD_APP_ID
            - name: GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: GUILD_ID
            - name: OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: OPENAI_KEY
            - name: REACTIBOT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: reactibot-env
                  key: REACTIBOT_API_KEY
