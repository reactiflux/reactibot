name: Node.js CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # TODO: see if we need to do anything special to cache docker images
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: npm

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Tag Build
        uses: docker/metadata-action@v4
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Only tag with latest if we're on main
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v3
        with:
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/actions' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deployment:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/actions'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to branch
        uses: actions/checkout@v3

      - name: Tag Build
        uses: docker/metadata-action@v4
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha

      - name: Create build context for k8s deployment
        # There should only be 1 tag, so 'join' will just produce a simple string
        run: |
          touch k8s-context
          echo IMAGE=${{ join(steps.meta.outputs.tags, '') }} > k8s-context
          cat k8s-context

      - name: Set up kubectl
        uses: matootie/dokube@ee111b5817358e3e0439c58985a36c7d6a737a15 # v1.4.0
        with:
          personalAccessToken: ${{ secrets.DIGITALOCEAN_TOKEN }}
          clusterName: k8s-rf

      - name: Deploy app
        # `|| echo \n` is to allow each of these steps to return non-zero exits
        # I don't remember why that was valuable but I'm afraid to remove it
        env:
          DISCORD_HASH: ${{ secrets.DISCORD_HASH }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          AMPLITUDE_KEY: ${{ secrets.AMPLITUDE_KEY }}
          REACTIBOT_API_KEY: ${{ secrets.REACTIBOT_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
        run: |
          kubectl diff -k . || echo \n
          args=()
          for k in DISCORD_HASH DISCORD_PUBLIC_KEY DISCORD_APP_ID GUILD_ID GH_READ_TOKEN AMPLITUDE_KEY REACTIBOT_API_KEY OPENAI_KEY; do
            args+=("--from-literal=$k=${!k}")
          done
          kubectl create secret generic reactibot-env "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f - || echo \n
          kubectl apply -k .
